<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Residencial do Fundo — Maquete 3D</title>
<style>
:root{--ink:#1c2733;--mut:#5d6b78;--line:#d7dde3;--bg:#f3f5f6;--acc:#1f4e79}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.3 system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);z-index:5}
h1{font-size:20px;margin:0 6px 0 0;letter-spacing:-.01em;white-space:nowrap}
.grp{display:flex;align-items:center;gap:8px}
.grp>span{font:600 10.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
button{font:inherit;color:inherit;border:0;background:#fff;padding:6px 12px;cursor:pointer}
.seg button.on,#lbtn.on,#mbtn.on,#pbtn.on{background:var(--acc);color:#fff}
#lbtn,#mbtn,#pbtn{border:1px solid var(--line);border-radius:7px}
.lb.m{background:#c23b22;color:#fff;font-size:13.5px}
#cross{display:none;position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6);z-index:4;pointer-events:none}
#hour{width:150px;accent-color:var(--acc)}
#hlabel{font:500 14px ui-monospace,Consolas,monospace;min-width:44px}
#gosel{display:none;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;max-width:210px}
#view{position:relative;flex:1;min-height:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.93);font-weight:600;font-size:12.5px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);will-change:transform}
.lb.l{font-size:13.5px}.lb.a{font-weight:500;font-size:12px}
#go{position:absolute;left:14px;top:14px;width:214px;max-height:calc(100% - 28px);overflow:auto;background:rgba(255,255,255,.95);border-radius:10px;padding:12px 10px;box-shadow:0 2px 14px rgba(0,0,0,.2);z-index:3}
#go b{display:block;font-size:16px;margin:0 6px 6px}
#go h4{margin:10px 6px 4px;font:600 10.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
#go button{display:block;width:100%;text-align:left;background:none;padding:5px 8px;border-radius:6px}
#go button:hover{background:#e8eef4}#go button.cur{background:#dfe9f3;font-weight:600}
#gotoggle{display:none}
#hint{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.92);padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--mut);box-shadow:0 1px 6px rgba(0,0,0,.2);z-index:3;max-width:calc(100% - 28px)}
#joy{display:none;position:absolute;left:22px;bottom:26px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.8);z-index:4;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(31,78,121,.85)}
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;font-size:16px;color:var(--mut);padding:24px;text-align:center}
.noui header,.noui #go,.noui #hint{display:none}
@media (max-width:820px){
  header{padding:8px 10px;gap:6px 10px}h1{font-size:16px;width:100%}
  .grp>span{display:none}#hour{width:104px}button{padding:6px 9px}
  #go{display:none}#gosel{display:block}
  #hint{left:10px;right:10px;bottom:8px;text-align:center;font-size:11.5px}
  #joy{bottom:54px}
}
</style>
</head>
<body>
<header>
  <h1>Residencial do Fundo</h1>
  <div class="grp"><span>Navegar</span><div class="seg" id="nav"><button data-m="orbit" class="on">Girar</button><button data-m="walk">Caminhar</button></div></div>
  <div class="grp"><span>Hora</span><input id="hour" type="range" min="6" max="19.5" step="0.25"><span id="hlabel" style="letter-spacing:0;color:var(--ink)">16:30</span></div>
  <div class="grp"><span>Qualidade</span><div class="seg" id="q"><button data-q="alta">Alta</button><button data-q="leve">Leve</button></div></div>
  <button id="lbtn">Rótulos</button>
  <button id="pbtn" class="on">Pessoas</button>
  <button id="mbtn">Medir</button>
  <select id="gosel" aria-label="Ir para"></select>
</header>
<div id="view">
  <div id="labels"></div>
  <nav id="go"><b>Ir para</b></nav>
  <button id="gotoggle"></button>
  <div id="hint"></div>
  <div id="cross"></div>
  <div id="joy"><i></i></div>
  <div id="load">Montando a maquete…</div>
</div>
<script>/*APP*/</script>
</body>
</html>
