75.00" height="6.10" class="box"/><text x="454.00" y="253.50" text-anchor="start" style="font-size:2.8px;">Áreas comuns e verdes</text><line x1="657.00" y1="249.00" x2="657.00" y2="255.10" class="thin"/><text x="725.00" y="253.50" text-anchor="end" style="font-size:2.8px;">318,41  —  12,1 %</text><text x="452.00" y="265.10" text-anchor="start" style="font-size:3px;font-weight:700;">PONTOS A VERIFICAR E NOTAS</text><line x1="452.00" y1="266.50" x2="542.00" y2="266.50" class="med"/><text x="452.00" y="271.10" text-anchor="start" style="font-size:2.65px;">1. LARGURA: desenho em 33,00 m (croqui) com faixa de 1,00 m de folga/cerca viva junto ao muro do vizinho. Confirmar 33 ou 34 m na matrícula</text><text x="452.00" y="275.40" text-anchor="start" style="font-size:2.65px;">    e por levantamento topográfico antes de locar a obra. Norte aproximado (avenida ao norte) — conferir.</text><text x="452.00" y="279.70" text-anchor="start" style="font-size:2.65px;">2. RETORNO: o Ø 10 m do croqui é pequeno para manobra (carro de passeio pede ≈ 11–12 m entre guias). Proposto Ø 14 m com ilha Ø 3 m,</text><text x="452.00" y="284.00" text-anchor="start" style="font-size:2.65px;">    sem afetar as kitnets. Caminhão de lixo/bombeiros não manobra: coleta no abrigo e hidrante/alcance a verificar com o Corpo de Bombeiros.</text><text x="452.00" y="288.30" text-anchor="start" style="font-size:2.65px;">3. LEGISLAÇÃO: conferir na Prefeitura de Foz do Iguaçu (zoneamento, código de obras, lei de condomínio de lotes) o lote mínimo, a largura</text><text x="452.00" y="292.60" text-anchor="start" style="font-size:2.65px;">    mínima de via interna, raio de retorno, vagas, recuos, taxa de ocupação e permeabilidade. Os lotes de 148,50 m² e a servidão de 6 m</text><text x="452.00" y="296.90" text-anchor="start" style="font-size:2.65px;">    são os pontos mais sensíveis para aprovação como condomínio de lotes (Lei 13.465/2017) ou desmembramento com servidão.</text><text x="452.00" y="301.20" text-anchor="start" style="font-size:2.65px;">4. INFRAESTRUTURA: prever entrada de energia e medição agrupada (E) e hidrômetro geral (H) na portaria, com redes enterradas sob as calçadas.</text><text x="452.00" y="305.50" text-anchor="start" style="font-size:2.65px;">    Sem rede pública de esgoto: fossa/filtro/sumidouro por unidade ou estação compacta (S). Drenagem com caimento para a rua transversal.</text><text x="452.00" y="309.80" text-anchor="start" style="font-size:2.65px;">5. MUROS: novos na divisa oeste (80 m) e fundo (33–34 m), bloco de concreto h 2,20 m, pilaretes a cada 3,00 m. Lado leste: muro existente.</text><text x="452.00" y="314.10" text-anchor="start" style="font-size:2.65px;">6. Linhas de transmissão ao longe: confirmar que a faixa de servidão da LT não alcança o terreno.</text><text x="452.00" y="318.40" text-anchor="start" style="font-size:2.65px;">7. Demolir o galpão em L de lona e madeira antes da terraplenagem (ver situação).</text><rect x="25.00" y="10.00" width="806.00" height="574.00" class="thk"/><rect x="641.00" y="522.00" width="190.00" height="62.00" class="box"/><line x1="641.00" y1="538.00" x2="831.00" y2="538.00" class="med"/><line x1="641.00" y1="556.00" x2="831.00" y2="556.00" class="med"/><line x1="641.00" y1="570.00" x2="831.00" y2="570.00" class="med"/><line x1="791.00" y1="556.00" x2="791.00" y2="584.00" class="med"/><line x1="736.00" y1="570.00" x2="736.00" y2="584.00" class="med"/><text x="645.00" y="530.00" text-anchor="start" style="font-size:5.2px;font-weight:700;">RESIDENCIAL DO FUNDO</text><text x="645.00" y="535.30" text-anchor="start" style="font-size:2.5px;">Condomínio de lotes e kitnets — Av. Fiorino Brol, Foz do Iguaçu / PR</text><text x="645.00" y="545.50" text-anchor="start" style="font-size:4.2px;font-weight:700;">IMPLANTAÇÃO E SITUAÇÃO</text><text x="645.00" y="552.00" text-anchor="start" style="font-size:2.7px;">Implantação do fundo (33 × 80 m), situação e quadro geral de áreas</text><text x="645.00" y="561.00" text-anchor="start" style="font-size:1.8px;fill:#666;">FASE</text><text x="645.00" y="567.00" text-anchor="start" style="font-size:3.4px;font-weight:700;fill:#8a2a1c;">ESTUDO PRELIMINAR</text><text x="795.00" y="561.00" text-anchor="start" style="font-size:1.8px;fill:#666;">PRANCHA</text><text x="811.00" y="580.00" text-anchor="middle" style="font-size:9px;font-weight:700;">01/06</text><text x="645.00" y="574.50" text-anchor="start" style="font-size:1.8px;fill:#666;">ESCALAS</text><text x="645.00" y="580.00" text-anchor="start" style="font-size:2.6px;">Indicadas (impressão em A1)</text><text x="740.00" y="574.50" text-anchor="start" style="font-size:1.8px;fill:#666;">DATA</text><text x="740.00" y="580.00" text-anchor="start" style="font-size:2.6px;">14/11/2026</text><text x="716.00" y="561.00" text-anchor="start" style="font-size:2.1px;fill:#444;">Cotas e níveis em metros</text><text x="716.00" y="565.00" text-anchor="start" style="font-size:2.1px;fill:#444;">Não válido para aprovação/obra:</text><text x="716.00" y="568.60" text-anchor="start" style="font-size:2.1px;fill:#444;">requer projeto legal com RRT/ART</text></svg></div><div class='p'><svg xmlns="http://www.w3.org/2000/svg" width="841mm" height="594mm" viewBox="0 0 841 594"><style>
